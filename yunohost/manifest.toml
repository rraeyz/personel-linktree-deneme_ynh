#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "personal_linktree"
name = "Personal Linktree"
description.en = "Self-hosted link tree with analytics, custom email, and rich features"
description.tr = "Analytics, özel email ve zengin özelliklere sahip kendi sunucunuzda link tree"

version = "1.0~ynh1"

maintainers = ["rraeyz"]

[upstream]
license = "MIT"
code = "https://github.com/yourusername/personal-linktree"
admindoc = "https://github.com/yourusername/personal-linktree/blob/main/README.md"

[integration]
yunohost = ">= 11.2"
architectures = "all"
multi_instance = true
ldap = false
sso = false
disk = "500M"
ram.build = "1G"
ram.runtime = "512M"

[install]
    [install.domain]
    type = "domain"
    help.en = "Choose a domain for your linktree"
    help.tr = "Linktree'niz için bir domain seçin"

    [install.path]
    type = "path"
    default = "/linktree"
    help.en = "URL path for the application"
    help.tr = "Uygulama için URL yolu"

    [install.init_main_permission]
    type = "group"
    default = "visitors"
    help.en = "Who can access the public linktree page"
    help.tr = "Herkese açık linktree sayfasına kimler erişebilir"

    [install.admin]
    type = "user"
    help.en = "Choose an admin user (YunoHost user)"
    help.tr = "Bir admin kullanıcı seçin (YunoHost kullanıcısı)"

    [install.password]
    type = "password"
    help.en = "Admin password for the linktree panel"
    help.tr = "Linktree paneli için admin şifresi"

[resources]
    [resources.system_user]
    allow_email = true

    [resources.install_dir]
    dir = "/opt/yunohost/__APP__"

    [resources.data_dir]
    dir = "/home/yunohost.app/__APP__"

    [resources.permissions]
    main.url = "/"
    admin.url = "/admin"
    admin.allowed = "admins"

    [resources.ports]
    main.default = 3000

    [resources.apt]
    packages = []

    extras.docker.repo = "deb https://download.docker.com/linux/debian bullseye stable"
    extras.docker.key = "https://download.docker.com/linux/debian/gpg"
    extras.docker.packages = ["docker-ce", "docker-ce-cli", "containerd.io", "docker-compose-plugin"]
